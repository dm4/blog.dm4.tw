---
layout: default
---

<article>

    <div class="center">
        <h1 class="title">{{ page.title }}</h1>
        <time class="code">{{ page.date | date: '%B %-d, %Y' }}</time>
    </div>

    <div class="divider"></div>

    {{ content }}

    <div class="divider"></div>

    <div class="post-actions">
        <a class="post-action post-action-email" href="mailto:blog@dm4.tw" title="Email blog@dm4.tw"
            aria-label="Email blog@dm4.tw">
            <!-- Font Awesome Free envelope icon (CC BY 4.0): https://fontawesome.com/icons/envelope -->
            <svg class="post-action-icon" aria-hidden="true" viewBox="0 0 512 512">
                <path
                    d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4C504.9 141.3 512 127.1 512 112c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z">
                </path>
            </svg>
        </a>
        <a class="post-action" href="https://buymeacoffee.com/dm4tw" target="_blank" rel="noopener noreferrer">
            <b><span class="support-heart">♥</span> Support Me</b>
        </a>
    </div>

</article>

<div class="page-navigation code">
    {% if page.next.url %}
    <a class="next" href="{{ page.next.url | prepend: site.baseurl | prepend: site.url }}"
        title="NEXT: {{page.next.title}}">&lt;&lt;</a>
    <span> &middot; </span>
    {% endif %}
    <a class="home" href="{{ "/" | prepend: site.baseurl | prepend: site.url }}" title="Back to Index">Index</a>
    {% if page.previous.url %}
    <span> &middot; </span>
    <a class="prev" href="{{ page.previous.url | prepend: site.baseurl | prepend: site.url }}"
        title="PREV: {{page.previous.title}}">&gt;&gt;</a>
    {% endif %}
</div>
